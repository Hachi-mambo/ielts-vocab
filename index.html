<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2937"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IELTS刷词"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>IELTS 词汇刷题</title></head><body><main class="app"><div class="top"><div><h1>IELTS 词汇刷题</h1><div class="small">iPhone · 可离线 · 可持续导入 Day 文档</div></div><div class="pill" id="count">0 词</div></div>
<section id="study"><div class="card"><div class="row"><select id="mode"><option value="en-zh">英 → 中</option><option value="zh-en">中 → 英</option></select><select id="type"><option value="choice">四选一</option><option value="input">拼写回忆</option></select><select id="day"><option value="all">全部 Day</option></select></div></div><div class="card" id="qcard"><div class="small" id="meta"></div><div class="word" id="prompt">载入中…</div><div id="choices"></div><div id="inputArea" class="hide"><input class="answer" id="answer" autocomplete="off" autocapitalize="none" placeholder="输入答案"><button style="margin-top:10px" id="check">检查</button></div><div id="reveal" class="hide"><hr><div class="meaning" id="truth"></div><div class="note" id="note"></div><div class="row" style="margin-top:14px"><button class="danger" id="again">不熟</button><button class="good" id="known">记住了</button></div></div></div></section>
<section id="import" class="hide"><div class="card"><h2>导入新的学习总结</h2><p class="note">直接从 iPhone“文件”App 选择我们生成的 .docx。软件会读取表格中的 Word / expression、Meaning、Today’s note，并合并到现有词库。</p><div class="importbox"><input type="file" id="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div><div id="importResult" class="note" style="margin-top:12px"></div></div><div class="card"><h2>备份</h2><div class="row"><button id="export">导出词库 JSON</button><label class="btn secondary">恢复 JSON<input id="restore" type="file" accept=".json" hidden></label></div></div></section>
<section id="stats" class="hide"><div class="card"><div class="stat" id="todayStat">0 / 0</div><div class="note">本次练习正确 / 已答</div></div><div class="card"><h2>错词优先</h2><div class="note">答错或点“不熟”的词会提高出现概率；点“记住了”后会逐渐降低出现频率。数据保存在这台 iPhone 的浏览器里。</div></div></section>
<nav class="tabs"><button data-tab="study">刷题</button><button data-tab="import" class="secondary">导入</button><button data-tab="stats" class="secondary">进度</button></nav></main><script src="jszip.min.js"></script><script src="app.js"></script></body></html>
